name: Full Regression CI

on:
  push:
    paths:
      - 'rtl/*.v'
      - 'rtl/*.vh'
      - 'sim/Makefile'
      - 'sim/tb/*.v'
      - 'sim/script/*'
      - '.github/workflows/full-regression-ci.yml'
  pull_request:
    paths:
      - 'rtl/*.v'
      - 'rtl/*.vh'
      - 'sim/Makefile'
      - 'sim/tb/*.v'
      - 'sim/script/*'
      - '.github/workflows/full-regression-ci.yml'
  workflow_dispatch:

jobs:
  full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run complete directed regression through sim Makefile
        run: |
          cd sim
          make SIMULATOR=iverilog regression
