name: Top Compile CI

on:
  push:
    paths:
      - 'rtl/*.v'
      - 'rtl/*.vh'
      - '.github/workflows/top-compile-ci.yml'
  pull_request:
    paths:
      - 'rtl/*.v'
      - 'rtl/*.vh'
      - '.github/workflows/top-compile-ci.yml'
  workflow_dispatch:

jobs:
  top-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Compile full RTL top
        run: |
          mkdir -p sim/build
          iverilog -g2012 -I rtl -s axi_dma_ctrl             -o sim/build/axi_dma_ctrl_top.vvp             rtl/dma_reset_sync.v \
            rtl/dma_data_fifo.v             rtl/dma_read_engine.v             rtl/dma_write_engine.v             rtl/dma_ctrl.v             rtl/dma_cdc.v             rtl/dma_apb_regs.v             rtl/axi_dma_ctrl.v
