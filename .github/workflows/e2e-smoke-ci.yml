name: End-to-End Smoke CI

on:
  push:
    paths:
      - 'rtl/*.v'
      - 'rtl/*.vh'
      - 'sim/tb/tb_axi_dma_ctrl_smoke.v'
      - '.github/workflows/e2e-smoke-ci.yml'
  pull_request:
    paths:
      - 'rtl/*.v'
      - 'rtl/*.vh'
      - 'sim/tb/tb_axi_dma_ctrl_smoke.v'
      - '.github/workflows/e2e-smoke-ci.yml'
  workflow_dispatch:

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Compile smoke test
        run: |
          mkdir -p sim/build
          iverilog -g2012 -I rtl -s tb_axi_dma_ctrl_smoke             -o sim/build/tb_axi_dma_ctrl_smoke.vvp             rtl/dma_data_fifo.v             rtl/dma_read_engine.v             rtl/dma_write_engine.v             rtl/dma_ctrl.v             rtl/dma_cdc.v             rtl/dma_apb_regs.v             rtl/axi_dma_ctrl.v             sim/tb/tb_axi_dma_ctrl_smoke.v
      - name: Run smoke test
        run: |
          set -o pipefail
          vvp sim/build/tb_axi_dma_ctrl_smoke.vvp | tee sim/build/tb_axi_dma_ctrl_smoke.log
          grep -q "PASS tb_axi_dma_ctrl_smoke" sim/build/tb_axi_dma_ctrl_smoke.log
