name: Coverage Preflight Python CI
on:
  push:
  pull_request:
jobs:
  parser-and-preflight:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python compile
        run: python -m compileall -q sim/script
      - name: URG parser regression
        run: python -m unittest discover -s sim/script/tests -p 'test_*.py' -v
      - name: Mapping source static validation
        run: cd sim && python script/validate_coverage_mapping.py
